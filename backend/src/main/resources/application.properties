server.address=127.0.0.1
server.port=${PORT:8191}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=${NS_MIGRATE:false}
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=257MB
ns.role=${NS_ROLE:admin}
ns.media-dir=${NS_MEDIA_DIR:/var/lib/naturalstreaming-bank}
ns.ffmpeg=${FFMPEG:ffmpeg}
ns.console-origin=${CONSOLE_ORIGIN:https://admin.naturalstreaming.net}
ns.media-url=${MEDIA_URL:https://media.naturalstreaming.net}
spring.web.resources.cache.cachecontrol.no-store=true
