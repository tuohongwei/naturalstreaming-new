server.address=127.0.0.1
server.port=${PORT:8190}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
spring.mvc.async.request-timeout=30000
ns.role=${NS_ROLE:api}
ns.storage=${STORAGE_ROOT:./.local/media}
ns.media-url=${MEDIA_URL:https://media.naturalstreaming.net}
ns.signing-key=${SIGNING_KEY}
ns.ffprobe=${FFPROBE:ffprobe}
ns.ffmpeg=${FFMPEG:ffmpeg}
