<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>NaturalStreaming · 内容管理</title>
 <meta name="color-scheme" content="light"><link rel="stylesheet" href="/console.css">
 <script src="/console-policy.js" defer></script><script src="/console.js" defer></script>

<body>
 <div id="login" class="login-shell" hidden>
  <section class="login-brand"><div class="brand-mark">ns</div><div class="eyebrow">NATURALSTREAMING</div><h1>声音内容的<br>管理空间。</h1><p>整理主题，打磨每条音轨，<br>把准备好的声音交给用户。</p><div class="sound-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="login-foot">CONTENT WORKSPACE</span></section>
  <section class="login-form"><div><span class="eyebrow">管理后台</span><h2>欢迎回来</h2><p class="muted">使用独立管理员账号登录</p><form id="login-form"><label>账号<input name="username" autocomplete="username" value="admin" required maxlength="80"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><div id="login-error" class="form-error" role="alert"></div><button class="button primary wide" type="submit">登录后台</button></form><p class="fine">App 测试账号不用于登录此后台。<br>管理会话闲置 30 分钟后失效。</p></div></section>
 </div>
 <div id="workspace" class="workspace" hidden>
  <aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark small">ns</span><span>NaturalStreaming<small>内容管理</small></span></a><div class="nav-caption">工作空间</div><nav id="nav"><button data-page="overview"><span class="nav-icon">◫</span>内容概览</button><button data-page="themes"><span class="nav-icon">♫</span>主题库</button><button data-page="upload"><span class="nav-icon">＋</span>上传内容</button><button data-page="accounts"><span class="nav-icon">◎</span>账号与授权</button><button data-page="audit"><span class="nav-icon">≡</span>操作记录</button></nav><div class="sidebar-bottom"><span class="status-dot"></span>开发环境<small>naturalstreaming.net</small></div></aside>
  <div class="main-shell"><header class="topbar"><span class="breadcrumb">工作空间 <b>/</b> <span id="breadcrumb">内容概览</span></span><div class="top-actions"><span class="user-avatar">A</span><span id="username">admin</span><button class="text-button" data-action="password">修改密码</button><button class="text-button" data-action="logout">退出</button></div></header><main id="main" aria-live="polite"><div class="loading">正在连接后台…</div></main><footer class="footer">NaturalStreaming · 版本化主题管理<span>时间按当前设备时区显示</span></footer></div>
 </div>
 <div id="toasts" class="toasts" aria-live="polite"></div>
 <dialog id="dialog"><div id="dialog-body"></div></dialog>
